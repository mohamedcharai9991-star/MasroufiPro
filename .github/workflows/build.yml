name: Build MasroufiPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q *.zip -d source
          
          GRADLEW=$(find source -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasroufiPro-APK
          path: '**/build/outputs/apk/**/*.apk'
